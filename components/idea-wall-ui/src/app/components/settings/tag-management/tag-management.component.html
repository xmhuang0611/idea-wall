<div class="tag-management">
  <div class="header">
    <h2>Tag Management</h2>
    <p-button 
      icon="pi pi-plus" 
      label="Add Tag" 
      (onClick)="openTagModal()">
    </p-button>
  </div>

  <p-table 
    [value]="tags" 
    styleClass="p-datatable-sm"
    [showCurrentPageReport]="false"
    [paginator]="false"
    [expandedRowKeys]="expandedRowKeys"
    (onRowExpand)="onRowExpand($event)"
    (onRowCollapse)="onRowCollapse($event)"
    dataKey="tag_id">
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 3rem"></th>
        <th>Tag Name</th>
        <th>Parent Tag</th>
        <th>Created At</th>
        <th>Updated At</th>
        <th style="width: 120px">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tag let-expanded="expanded">
      <tr>
        <td>
          <button 
            *ngIf="tag.parent_id === 0 && tag.children && tag.children.length > 0"
            type="button" 
            pButton 
            pRipple 
            [pRowToggler]="tag"
            class="p-button-text p-button-rounded p-button-plain"
            [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'">
          </button>
        </td>
        <td>{{ tag.tag_name }}</td>
        <td>-</td>
        <td>{{ tag.created_at | date:'medium' }}</td>
        <td>{{ tag.updated_at | date:'medium' }}</td>
        <td>
          <div class="flex gap-2">
            <p-button 
              icon="pi pi-pencil" 
              styleClass="p-button-text p-button-rounded" 
              (onClick)="openTagModal(tag)">
            </p-button>
            <p-button 
              icon="pi pi-trash" 
              styleClass="p-button-text p-button-rounded p-button-danger" 
              (onClick)="deleteTag(tag)">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="rowexpansion" let-tag>
      <tr *ngFor="let child of tag.children" class="child-row">
        <td></td>
        <td>
          <div class="flex align-items-center">
            <i class="pi pi-angle-right mr-2"></i>
            {{ child.tag_name }}
          </div>
        </td>
        <td>{{ tag.tag_name }}</td>
        <td>{{ child.created_at | date:'medium' }}</td>
        <td>{{ child.updated_at | date:'medium' }}</td>
        <td>
          <div class="flex gap-2">
            <p-button 
              icon="pi pi-pencil" 
              styleClass="p-button-text p-button-rounded" 
              (onClick)="openTagModal(child)">
            </p-button>
            <p-button 
              icon="pi pi-trash" 
              styleClass="p-button-text p-button-rounded p-button-danger" 
              (onClick)="deleteTag(child)">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Tag Form Dialog -->
  <p-dialog 
    [(visible)]="displayModal" 
    [header]="isEditing ? 'Edit Tag' : 'Add Tag'"
    [modal]="true"
    [style]="{width: '450px'}"
    [draggable]="false"
    [resizable]="false"
    (onHide)="handleCancel()">
    <form [formGroup]="tagForm" class="p-fluid">
      <div class="field">
        <label for="tag_name" class="font-bold">Tag Name</label>
        <input 
          id="tag_name" 
          type="text" 
          pInputText 
          formControlName="tag_name" 
          [ngClass]="{'ng-invalid ng-dirty': tagForm.get('tag_name')?.invalid && tagForm.get('tag_name')?.touched}"
          placeholder="Enter tag name">
        <small class="p-error" *ngIf="tagForm.get('tag_name')?.invalid && tagForm.get('tag_name')?.touched">
          Tag name is required
        </small>
      </div>
      <div class="field">
        <label for="parent_id" class="font-bold">Parent Tag</label>
        <p-dropdown
          appendTo="body"
          id="parent_id"
          [options]="parentTags"
          formControlName="parent_id"
          optionLabel="tag_name"
          optionValue="tag_id"
          [showClear]="true"
          placeholder="Select parent tag">
        </p-dropdown>
      </div>
    </form>
    <ng-template pTemplate="footer">
      <div class="flex justify-content-end gap-2">
        <p-button 
          label="Cancel" 
          icon="pi pi-times" 
          (onClick)="handleCancel()" 
          styleClass="p-button-text">
        </p-button>
        <p-button 
          label="Save" 
          icon="pi pi-check" 
          (onClick)="handleOk()" 
          [disabled]="!tagForm.valid">
        </p-button>
      </div>
    </ng-template>
  </p-dialog>

  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>
</div>
