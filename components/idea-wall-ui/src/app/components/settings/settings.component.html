<div class="settings-outer">
  <div class="settings-container">
    <app-settings-menu
      [selectedMenu]="selectedMenu"
      (menuSelect)="onMenuSelect($event)">
    </app-settings-menu>
    
    <main class="settings-content">
      <app-user-management *ngIf="selectedMenu === 'user-management'">
      </app-user-management>
      
      <app-tag-management *ngIf="selectedMenu === 'tag-management'">
      </app-tag-management>
    </main>
  </div>
</div>

<!-- Role Edit Modal -->
<div class="modal-backdrop" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h3>Edit User Roles</h3>
    <div class="modal-content">
      <div class="form-group">
        <label>Select Roles:</label>
        <div class="role-options">
          <div *ngFor="let role of availableRoles" class="role-option">
            <input
              type="checkbox"
              [id]="role"
              [checked]="isRoleSelected(role)"
              (change)="toggleRole(role)"
            >
            <label [for]="role">{{ roleDisplayMap[role] }}</label>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" (click)="closeModal()">Cancel</button>
      <button class="save-btn" (click)="saveRole()">Save</button>
    </div>
  </div>
</div>
