<div class="container">
  <!-- Breadcrumb Navigation -->
  <p-breadcrumb [model]="breadcrumbItems" [home]="homeItem" styleClass="mb-4"></p-breadcrumb>
  
  <!-- Loading Indicator -->
  <div *ngIf="isLoading" class="flex justify-content-center my-6">
    <p-progressSpinner></p-progressSpinner>
  </div>

  <!-- Ideas Table with Search -->
  <p-card *ngIf="!isLoading">
    <!-- Search and Filters -->
    <div class="flex justify-content-between align-items-center mb-4">
      <div class="p-inputgroup" style="width: 50%;">
        <input type="text" pInputText [(ngModel)]="searchQuery" placeholder="Search ideas...">
        <button pButton icon="pi pi-search" (click)="onSearch()"></button>
        <button pButton icon="pi pi-times" (click)="clearSearch()" *ngIf="searchQuery"></button>
      </div>
    </div>

    <p-table [value]="ideas" [tableStyle]="{'min-width': '50rem'}" 
             styleClass="p-datatable-sm" [rowHover]="true">
      <ng-template pTemplate="header">
        <tr>
          <th>Title</th>
          <th>Creator</th>
          <th>Status</th>
          <th>Score</th>
          <th>Reviews</th>
          <th>Submitted</th>
          <th>Action</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-idea>
        <tr>
          <td>
            <div class="font-medium">{{idea.title}}</div>
          </td>
          <td>{{idea.creator_name}}</td>
          <td>
            <div *ngIf="idea.incubator_review?.status; else noStatus">
              <p-tag 
                [value]="getReviewStatusLabel(idea.incubator_review.status)" 
                [severity]="getReviewStatusSeverity(idea.incubator_review.status)"
                [rounded]="true">
              </p-tag>
            </div>
            <ng-template #noStatus>
              <span class="text-500">-</span>
            </ng-template>
          </td>
          <td>
            <div *ngIf="idea.incubator_review?.average_score; else noScore">
              <p-tag 
                [value]="idea.incubator_review?.average_score.toFixed(1)" 
                [severity]="getScoreSeverity(idea.incubator_review?.average_score)"
                [rounded]="true">
              </p-tag>
            </div>
            <ng-template #noScore>
              <span class="text-500">-</span>
            </ng-template>
          </td>
          <td>
            <div *ngIf="idea.incubator_review?.review_count; else noReviews">
              {{idea.incubator_review?.review_count}}
            </div>
            <ng-template #noReviews>
              <span class="text-500">0</span>
            </ng-template>
          </td>
          <td>
            <span *ngIf="idea.incubator_review?.submitted_at">
              {{idea.incubator_review?.submitted_at | date:'MMM d, y, h:mm a'}}
            </span>
            <span *ngIf="!idea.incubator_review?.submitted_at" class="text-500">-</span>
          </td>
          <td>
            <button pButton icon="pi pi-eye" class="p-button-rounded p-button-text p-button-sm"
                    (click)="viewIdea(idea.id)" pTooltip="View Details" tooltipPosition="top"></button>
            <button 
              *ngIf="canEditIncubatorReview(idea)"
              pButton 
              icon="pi pi-pencil" 
              class="p-button-rounded p-button-text p-button-sm ml-2"
              (click)="editIncubatorReview(idea)" 
              pTooltip="Resubmit" 
              tooltipPosition="top">
            </button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center p-4">
            <div class="flex flex-column align-items-center">
              <i class="pi pi-info-circle text-500 text-4xl mb-3"></i>
              <span class="text-lg font-medium">No incubator ideas found</span>
              <span class="text-500">Submit approved session ideas for incubator review</span>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>

    <!-- Pagination -->
    <div class="flex justify-content-center mt-4">
      <p-paginator 
        [rows]="pageSize" 
        [totalRecords]="totalItems" 
        [rowsPerPageOptions]="[5, 10, 25, 50]" 
        (onPageChange)="onPageChange($event)">
      </p-paginator>
    </div>
  </p-card>
</div>
