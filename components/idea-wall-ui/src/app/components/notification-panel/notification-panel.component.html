<div class="notification-trigger">
  <div class="notification-avatar-wrapper" (click)="onNotificationPanelToggle($event)">
    <p-avatar 
      icon="pi pi-bell" 
      shape="circle" 
      [style]="{'color': 'var(--primary-color)'}"
      class="cursor-pointer notification-avatar"
      pTooltip="Notifications"
      tooltipPosition="bottom">
    </p-avatar>
    <span *ngIf="badgeValue" class="notification-badge">{{ badgeValue }}</span>
  </div>

  <p-overlayPanel #notificationPanel [showCloseIcon]="false" [style]="{'width': '400px', 'max-height': '500px'}" (onShow)="onPanelShow()">
    <ng-template pTemplate="content">
      <div class="notification-panel">
        <!-- Header -->
        <div class="notification-header mb-3">
          <h4 class="m-0">Notifications</h4>
        </div>

        <!-- Notifications List -->
        <div class="notification-list">
          <ng-container *ngIf="notifications$ | async as notifications">
            <div *ngIf="notifications.length === 0" class="empty-state text-center p-4">
              <i class="pi pi-bell text-6xl text-400 mb-3"></i>
              <p class="text-600 m-0">No notifications yet</p>
            </div>

            <div *ngFor="let notification of notifications" 
                 class="notification-item p-3 cursor-pointer"
                 [class.unread]="!notification.is_read"
                 (click)="markAsRead(notification, $event)">
              
              <div class="flex align-items-start gap-3">
                <!-- Icon -->
                <div class="notification-icon flex-shrink-0">
                  <i [class]="getNotificationIcon(notification.type)" 
                     [style.color]="getNotificationColor(notification.type)"></i>
                </div>

                <!-- Content -->
                <div class="notification-content flex-1">
                  <p class="notification-text m-0 mb-1" [innerHTML]="notification.content"></p>
                  <div class="flex justify-content-between align-items-center">
                    <small class="text-500">{{ getRelativeTime(notification.created_at) }}</small>
                    <span *ngIf="!notification.is_read" class="unread-indicator"></span>
                  </div>
                </div>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </ng-template>
  </p-overlayPanel>
</div>
