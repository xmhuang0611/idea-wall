<p-card class="mb-5">
  <!-- Submit Button -->
  <div class="flex justify-content-between gap-2 mb-4 align-items-center">
    <div class="flex align-items-center gap-4">
      <div class="flex align-items-center">
        <span class="text-base font-medium">My Ideas</span>
        <p-inputSwitch [(ngModel)]="showMyIdeas"
                      [disabled]="!authService.isLoggedIn()"
                      (ngModelChange)="onMyIdeasChange($event)"
                      class="ml-2">
        </p-inputSwitch>
      </div>
      <div class="flex align-items-center">
        <span class="text-base font-medium">My Voted</span>
        <p-inputSwitch [(ngModel)]="showMyVoted"
                      [disabled]="!authService.isLoggedIn()"
                      (ngModelChange)="onMyVotedChange($event)"
                      class="ml-2">
        </p-inputSwitch>
      </div>
      <div class="flex align-items-center">
        <span class="text-base font-medium">My Bookmarked</span>
        <p-inputSwitch [(ngModel)]="showMyBookmarked"
                      [disabled]="!authService.isLoggedIn()"
                      (ngModelChange)="onMyBookmarkedChange($event)"
                      class="ml-2">
        </p-inputSwitch>
      </div>
    </div>
    <button pButton
            pRipple
            icon="pi pi-plus"
            label="Submit Your Idea"
            routerLink="/submit-idea"
            [disabled]="!authService.isLoggedIn()"
            class="p-button-rounded ml-4"
            (click)="!authService.isLoggedIn() && $event.preventDefault()">
    </button>
  </div>

  <!-- Filters Row -->
  <div class="flex gap-3 mb-5">
    <!-- Search -->
    <div style="width: 50%;">
      <label class="block mb-1">Search</label>
      <div class="p-inputgroup">
        <input type="text"
               pInputText
               [(ngModel)]="searchQuery"
               (input)="onSearch()"
               placeholder="Search ideas..."
               class="w-full">
        <span class="p-inputgroup-addon">
          <i class="pi pi-search"></i>
        </span>
      </div>
    </div>

    <!-- Tag Filter -->
    <div style="width: 25%;">
      <label class="block mb-1">Tags</label>
      <p-multiSelect 
        [options]="availableTags"
        [(ngModel)]="selectedTags"
        optionLabel="label"
        optionValue="tag_id"
        [showToggleAll]="false"
        placeholder="Filter by tags"
        [style]="{'width': '100%'}"
        [resetFilterOnHide]="true"
        [filter]="true"
        filterBy="label"
        (onChange)="onTagFilterChange()">
      </p-multiSelect>
    </div>

    <!-- Sort -->
    <div style="width: 25%;">
      <label class="block mb-1">Sort By</label>
      <p-dropdown 
        [options]="[
          {label: 'Latest Created', value: 'created_at'},
          {label: 'Latest Updated', value: 'updated_at'},
          {label: 'Most Popular', value: 'total_votes'}
        ]"
        [(ngModel)]="sortBy"
        [style]="{'width': '100%'}"
        (onChange)="onSortChange()">
      </p-dropdown>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-content-center align-items-center py-5">
    <p-progressSpinner 
      [style]="{width: '50px', height: '50px'}" 
      strokeWidth="4"
      fill="var(--surface-ground)" 
      animationDuration=".5s">
    </p-progressSpinner>
  </div>

  <!-- Ideas List -->
  <div *ngIf="!isLoading" class="ideas-container">
    <p-card *ngFor="let idea of ideas"
         class="idea-card mb-3"
         (click)="openDetails(idea.id)">
      <div class="flex">
        <!-- Feeling Column -->
        <div class="flex flex-column align-items-center mr-3" style="width: 64px">
          <div class="feeling-image-container">
            <img [src]="feelingUtil.getFeelingImage(idea.feeling)"
                 [alt]="feelingUtil.getFeelingLabel(idea.feeling)"
                 class="feeling-image"
                 [title]="feelingUtil.getFeelingLabel(idea.feeling)">
          </div>
        </div>

        <!-- Content Column -->
        <div class="flex-1">
          <!-- Title and Edit Button -->
          <div class="flex justify-content-between align-items-center mb-2">
            <h3 class="text-primary m-0">{{idea.title}}</h3>
            <div class="flex gap-2">
              <button pButton
                      icon="pi pi-history"
                      class="p-button-rounded p-button-text p-button-sm"
                      (click)="viewIdeaHistory(idea.id)"
                      pTooltip="View History"
                      tooltipPosition="top">
              </button>
              <button *ngIf="canEditIdea(idea)"
                      pButton
                      icon="pi pi-pencil"
                      class="p-button-rounded p-button-text p-button-sm"
                      (click)="$event.stopPropagation(); editIdea(idea.id)"
                      pTooltip="Edit Idea"
                      tooltipPosition="top">
              </button>
              <button *ngIf="canEditIdea(idea)"
                      pButton
                      icon="pi pi-trash"
                      class="p-button-rounded p-button-text p-button-danger p-button-sm"
                      (click)="$event.stopPropagation(); confirmDelete(idea)"
                      pTooltip="Delete Idea"
                      tooltipPosition="top">
              </button>
            </div>
          </div>

          <!-- Description -->
          <p class="mb-3 white-space-pre-line">{{idea.description}}</p>
          
          <!-- Tags -->
          <div class="flex flex-wrap mb-3">
            <p-tag *ngFor="let tag of idea.tag_details || []" 
                  [value]="tag?.tag_name || ''"
                  severity="info"
                  styleClass="mr-1 mb-1"
                  [rounded]="true">
            </p-tag>
          </div>
          
          <p-divider></p-divider>
          
          <!-- Bottom Bar -->
          <div class="flex justify-content-between align-items-center">
            <!-- Action Buttons -->
            <div class="flex align-items-center gap-2">
              <button pButton
                      pRipple
                      icon="pi pi-comment"
                      (click)="$event.stopPropagation(); openDetails(idea.id)" 
                      [label]="idea.total_comments.toString()"
                      class="p-button-rounded p-button-text p-button-sm"
                      pTooltip="View Comments"
                      tooltipPosition="top">
              </button>
              <button pButton
                      pRipple
                      (click)="$event.stopPropagation(); onVote(idea)"
                      class="p-button-rounded p-button-text p-button-sm"
                      [class.p-button-secondary]="!idea.has_voted"
                      [class.p-button-primary]="idea.has_voted"
                      icon="pi pi-thumbs-up-fill"
                      [label]="idea.total_votes.toString()"
                      pTooltip="{{idea.has_voted ? 'Unvote' : 'Vote'}}"
                      tooltipPosition="top">
              </button>
              <button pButton
                      pRipple
                      (click)="$event.stopPropagation(); onBookmark(idea)"
                      class="p-button-rounded p-button-text p-button-sm"
                      [class.p-button-secondary]="!idea.has_bookmarked"
                      [class.p-button-primary]="idea.has_bookmarked"
                      icon="pi pi-bookmark-fill"
                      [label]="idea.total_bookmarks.toString()"
                      pTooltip="{{idea.has_bookmarked ? 'Unbookmark' : 'Bookmark'}}"
                      tooltipPosition="top">
              </button>
              <button pButton
                      pRipple
                      icon="pi pi-share-alt"
                      (click)="$event.stopPropagation(); shareIdea(idea.id)"
                      class="p-button-rounded p-button-text p-button-sm"
                      pTooltip="Share Idea"
                      tooltipPosition="top">
              </button>
            </div>

            <!-- Creator Info -->
            <div class="flex align-items-center gap-2">
              <span class="font-bold">{{idea.creator_name}}</span>
              <span class="hidden sm:inline text-500">{{idea.created_at | date:'MMM d, y h:mm a'}}</span>
              <span class="sm:hidden text-500">{{idea.created_at | date:'short'}}</span>
            </div>
          </div>
        </div>
      </div>
    </p-card>
  </div>

  <!-- Pagination -->
  <div *ngIf="!isLoading" class="mt-4">
    <p-paginator
      [rows]="pageSize"
      [totalRecords]="totalItems"
      [rowsPerPageOptions]="pageSizeOptions"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}-{last} of {totalRecords}"
      [first]="(currentPage - 1) * pageSize"
      styleClass="border-none"
      (onPageChange)="onPageChange($event)">
    </p-paginator>
  </div>
</p-card>

<!-- Add confirmation dialog -->
<p-confirmDialog [style]="{width: '450px'}" styleClass="delete-confirm-dialog"></p-confirmDialog>

<!-- Idea Details Drawer -->
<app-idea-details-drawer
  [ideaId]="selectedIdeaId"
  [visible]="ideaDetailsVisible"
  (visibleChange)="ideaDetailsVisible = $event"
  (commentCountChange)="onCommentCountChange($event)"
  (voteStatusChange)="onVoteStatusChange($event)"
  (ideaDeleted)="onIdeaDeleted($event)">
</app-idea-details-drawer>

<!-- Idea History Dialog -->
<app-idea-history
  [ideaId]="historyIdeaId"
  [visible]="historyDialogVisible"
  (visibleChange)="historyDialogVisible = $event">
</app-idea-history>
